[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-platform"
version = "0.1.0"
description = "Provenance-first OCR/data extraction for FAMILY_SURVEY_V1"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  # Pins validated by scripts/run_spike.py go/no-go matrix before R0 extraction.
  # Rasterizer primary candidate: pypdfium2 (ADR-001) — add exact pin post-spike.
  # Do not add paddleocr/paddlepaddle pins until spike records exact versions.
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "pypdf>=4.2",
  "pillow>=10.3",
]

[project.optional-dependencies]
benchmark = ["pypdfium2>=4.30,<6"]
benchmark-local = ["transformers>=4.57,<6", "torch>=2.4", "accelerate>=1.0"]
# Experimental crop flow only; production pins still require the compatibility spike.
flow = ["pypdfium2>=4.30,<6", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4", "laya>=0.3.26,<0.4"]
# Post-spike extras (documented intent; unpin after matrix go):
#   render = ["pypdfium2>=..."]   # ADR-001
#   ocr-cpu = ["paddleocr==...", "paddlepaddle==..."]
#   ocr-gpu = ["paddleocr==...", "paddlepaddle-gpu==..."]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_platform"]

[project.scripts]
ocr-benchmark = "ocr_platform.benchmark.cli:main"
ocr-flow = "ocr_platform.flow.cli:main"
ocr-train = "ocr_platform.training.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
