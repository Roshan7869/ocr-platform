[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-platform"
version = "0.1.0"
description = "Provenance-first OCR/data extraction for FAMILY_SURVEY_V1"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  # Pins validated by scripts/run_spike.py go/no-go matrix before R0 extraction.
  # Rasterizer primary candidate: pypdfium2 (ADR-001) — add exact pin post-spike.
  # Do not add paddleocr/paddlepaddle pins until spike records exact versions.
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "pypdf>=4.2",
  "pillow>=10.3",
  "pypdfium2>=4.30,<6",
  "paddleocr>=3.0,<4",
  "paddlepaddle>=3.0,<4",
  "laya>=0.3.26,<0.4",
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "pandas>=2.0,<3",
  "torch>=2.4,<3",
  "sentence-transformers>=3.0",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
benchmark = ["pypdfium2>=4.30,<6"]
benchmark-local = ["transformers>=4.57,<6", "torch>=2.4", "accelerate>=1.0"]
kaggle = ["ms-swift>=3.0", "transformers>=4.57,<6", "accelerate>=1.0", "huggingface-hub>=0.25"]
# Experimental crop flow only; production pins still require the compatibility spike.
flow = ["pypdfium2>=4.30,<6", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4", "laya>=0.3.26,<0.4"]
# Post-spike extras (documented intent; unpin after matrix go):
#   render = ["pypdfium2>=..."]   # ADR-001
#   ocr-cpu = ["paddleocr==...", "paddlepaddle==..."]
#   ocr-gpu = ["paddleocr==...", "paddlepaddle-gpu==..."]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_platform"]

[project.scripts]
ocr-benchmark = "ocr_platform.benchmark.cli:main"
ocr-flow = "ocr_platform.flow.cli:main"
ocr-train = "ocr_platform.training.cli:main"
ocr-survey = "ocr_platform.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Stream B (R0 remediation): ruff lints .ipynb/.md code blocks when no
# exclude is set. Exclude notebook/markdown artifacts and Kaggle entry
# points containing `!pip` notebook-magic lines (invalid Python syntax).
exclude = [
    "*.ipynb",
    "*.md",
    "kaggle_notebook.py",
    "kaggle_run.py",
]
